<!DOCTYPE html>
<html>
<head>
 <title>DOM 실습</title>
</head>
<body>
 <h1 id="title">Hello JavaScript</h1>
 <button id="btn">변경</button>
 <script>
 const title = document.querySelector("#title");
 const button = document.querySelector("#btn");
 button.addEventListener("click", () => {
 title.textContent = "DOM이 변경되었습니다.";
 });
 </script>
</body>
</html>
